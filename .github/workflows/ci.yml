name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node }} / Express ${{ matrix.express }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        express: ['4.22.3', '5.3.0']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install selected Express version
        run: npm install --no-save --no-audit --no-fund express@${{ matrix.express }}
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run unit and integration tests
        run: npm test
      - name: Check publish archive
        run: npm pack --dry-run
